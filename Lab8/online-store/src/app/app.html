<header class="navbar">
  <div class="logo">🛒 My Online Store</div>
  <nav class="categories">
    @for (category of categories; track category.id) {
      <a [routerLink]="'/category/' + category.id" routerLinkActive="active">
        {{ category.name }}
      </a>
    }
  </nav>
  <div class="search">
    <input type="text" placeholder="Search products..." [(ngModel)]="searchText">
  </div>
</header>

<div style="padding: 20px">
  <h2>⭐ Favorites ({{ favorites.length }})</h2>
  @if (favorites.length === 0) {
    <p>No favorite products yet</p>
  } @else {
    @for (product of favorites; track product.id) {
      <app-product-item
        [product]="product"
        (favoriteToggled)="onFavoriteToggled($event)"
        (delete)="onFavoriteToggled($event)">
      </app-product-item>
    }
  }
</div>

<main class="container">
  <router-outlet></router-outlet>
</main>
